# 自動実行（API 経路）
#
# - 1 時間ごと（毎時 30 分）: 管理画面やスケジュールで積まれたジョブ（提案・執筆・リライト・SNS）を実行する
#   ※ リポジトリを非公開にすると Actions は月 2,000 分の無料枠になるため、15 分ごとから間隔を広げた
# - 毎日 03:00 JST: 承認済みのキーワード候補を記事（下書き）にするジョブを積む（2 本まで）
# - 毎週月曜 05:00 JST: 候補を提案するジョブを積む（8 件）
# - 管理画面の「いま実行」ボタンからも起動される（workflow_dispatch）
#
# 必要な Secrets（リポジトリの Settings → Secrets and variables → Actions）:
#   ARTICLES_SUPABASE_URL / ARTICLES_SUPABASE_ANON_KEY … 本番サイトと同じ Supabase
#   ANTHROPIC_API_KEY … 執筆・リライト・SNS 投稿文（console.anthropic.com）
#   GEMINI_API_KEY    … SNS 投稿の画像（aistudio.google.com）
#   RAKKO_API_KEY     … キーワード提案（任意。無ければ提案ジョブは失敗し、Claude Code の /propose-keywords で代替）
#
# 注意: GitHub はリポジトリに 60 日間コミットが無いとスケジュール実行を止める（Actions タブで再開できる）。
name: 自動実行

on:
  schedule:
    - cron: "30 * * * *" # 待ちジョブの実行（毎時 30 分。03:00 / 05:00 の実行と重ならないように）
    - cron: "0 18 * * *" # 毎日 03:00 JST: 承認済み候補の記事化
    - cron: "0 20 * * 0" # 毎週月曜 05:00 JST: 候補の提案
  workflow_dispatch:
    inputs:
      task:
        description: 実行する処理
        type: choice
        options: [run, write, propose, status]
        default: run
      limit:
        description: 件数（write は記事数、propose は候補数）
        default: "2"

permissions:
  contents: read

concurrency:
  group: jobs
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ARTICLES_SUPABASE_URL: ${{ secrets.ARTICLES_SUPABASE_URL }}
      ARTICLES_SUPABASE_ANON_KEY: ${{ secrets.ARTICLES_SUPABASE_ANON_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      RAKKO_API_KEY: ${{ secrets.RAKKO_API_KEY }}
      NEXT_PUBLIC_SITE_URL: https://portal.pomie.jp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund

      - name: 処理を決める
        id: task
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "task=${{ inputs.task }}" >> "$GITHUB_OUTPUT"
            echo "limit=${{ inputs.limit }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 20 * * 0" ]; then
            echo "task=propose" >> "$GITHUB_OUTPUT"
            echo "limit=8" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 18 * * *" ]; then
            echo "task=write" >> "$GITHUB_OUTPUT"
            echo "limit=2" >> "$GITHUB_OUTPUT"
          else
            echo "task=run" >> "$GITHUB_OUTPUT"
            echo "limit=" >> "$GITHUB_OUTPUT"
          fi

      - name: 状態の確認
        if: steps.task.outputs.task == 'status'
        run: node scripts/articles/run.mjs status

      - name: ジョブを積む（スケジュール）
        if: steps.task.outputs.task == 'write' || steps.task.outputs.task == 'propose'
        run: node scripts/jobs/run.mjs enqueue ${{ steps.task.outputs.task }} --limit ${{ steps.task.outputs.limit }}

      - name: 待ちジョブを実行
        if: steps.task.outputs.task != 'status'
        run: node scripts/jobs/run.mjs run --max 6 --minutes 30
